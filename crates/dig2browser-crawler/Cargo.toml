[package]
name = "dig2browser-crawler"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Durable domain-neutral crawl scheduling core for dig2browser station"

[lib]
name = "dig2browser_crawler"
path = "src/lib.rs"

[dependencies]
scraper = { version = "=0.27.0", default-features = false, features = ["atomic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
