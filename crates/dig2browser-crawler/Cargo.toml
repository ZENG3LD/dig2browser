[package]
name = "dig2browser-crawler"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Durable domain-neutral crawl scheduling core for dig2browser station"
repository = "https://github.com/ZENG3LD/dig2browser"

[lib]
name = "dig2browser_crawler"
path = "src/lib.rs"

[dependencies]
ahash = "0.8"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
regex = "1"
rusqlite = { version = "=0.36.0", features = ["bundled"] }
scraper = { version = "=0.27.0", default-features = false, features = ["atomic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
