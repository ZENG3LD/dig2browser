[package]
name = "dig2browser-probe"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Controlled-origin browser persona observation transcript contract"

[lib]
name = "dig2browser_probe"
path = "src/lib.rs"

[dependencies]
dig2browser-core = { path = "../dig2browser-core" }
dig2browser-protocol = { path = "../dig2browser-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
