[package]
name = "dig2browser-probe"
version = "0.5.3"
edition = "2021"
license = "MIT"
description = "Controlled-origin browser persona observation transcript contract"
repository = "https://github.com/ZENG3LD/dig2browser"

[lib]
name = "dig2browser_probe"
path = "src/lib.rs"

[dependencies]
dig2browser-core = { path = "../dig2browser-core", version = "0.5.3" }
dig2browser-protocol = { path = "../dig2browser-protocol", version = "0.5.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
