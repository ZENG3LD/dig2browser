[package]
name = "dig2browser-shape"
version = "0.5.3"
edition = "2021"
license = "MIT"
description = "Declarative output-shaping extractor engine for dig2browser (Phase C, axis 7)"
repository = "https://github.com/ZENG3LD/dig2browser"

[lib]
name = "dig2browser_shape"
path = "src/lib.rs"

[dependencies]
dig2browser-protocol = { path = "../dig2browser-protocol", version = "0.5.3" }
scraper = { version = "0.27.0", default-features = false }
regex = "1"
serde_json = "1"
