[package]
name = "dig2browser-station"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Central resource owner and consumer facade for dig2browser runtimes"

[lib]
name = "dig2browser_station"
path = "src/lib.rs"

[features]
default = []
containment-test-hooks = ["dig2browser/containment-test-hooks"]
crawler-test-hooks = []
geckodriver-test-hooks = ["dig2browser/geckodriver-test-hooks"]
runtime-test-hooks = ["dig2browser/runtime-test-hooks"]
tls-test-hooks = ["dep:base64"]

[dependencies]
base64 = { version = "0.22", optional = true }
clap = { version = "4", features = ["derive"] }
dig2browser = { path = "../.." }
dig2browser-client = { path = "../dig2browser-client" }
dig2browser-core = { path = "../dig2browser-core" }
dig2browser-crawler = { path = "../dig2browser-crawler" }
dig2browser-protocol = { path = "../dig2browser-protocol" }
dig2browser-runtime-lightweight = { path = "../dig2browser-runtime-lightweight" }
dig2browser-trace = { path = "../dig2browser-trace" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Rpc",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[dev-dependencies]
dig2browser-client = { path = "../dig2browser-client" }
dig2browser-probe = { path = "../dig2browser-probe" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
