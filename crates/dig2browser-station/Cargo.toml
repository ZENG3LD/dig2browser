[package]
name = "dig2browser-station"
version = "0.5.3"
edition = "2021"
license = "MIT"
description = "Central resource owner and consumer facade for dig2browser runtimes"
repository = "https://github.com/ZENG3LD/dig2browser"

[lib]
name = "dig2browser_station"
path = "src/lib.rs"

[features]
default = []
containment-test-hooks = ["dig2browser/containment-test-hooks"]
# Durable crawl support: `dig2browser-crawler`-backed frontier, `crawl.rs`,
# the `Crawl` IPC route, and the CLI's `--crawl-root`/`--allow-crawl-*`
# flags. Off by default — a default station build owns no crawl state and
# links no `dig2browser-crawler` code.
crawler = ["dep:dig2browser-crawler"]
crawler-test-hooks = []
geckodriver-test-hooks = ["dig2browser/geckodriver-test-hooks"]
runtime-test-hooks = ["dig2browser/runtime-test-hooks"]
tls-test-hooks = []

[[test]]
name = "crawler_e2e"
path = "tests/crawler_e2e.rs"
required-features = ["crawler"]

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dig2browser = { path = "../..", version = "0.5.3" }
dig2browser-client = { path = "../dig2browser-client", version = "0.5.3" }
dig2browser-core = { path = "../dig2browser-core", version = "0.5.3" }
dig2browser-crawler = { path = "../dig2browser-crawler", version = "0.5.3", optional = true }
dig2browser-protocol = { path = "../dig2browser-protocol", version = "0.5.3" }
dig2browser-runtime-lightweight = { path = "../dig2browser-runtime-lightweight", version = "0.5.3" }
dig2browser-shape = { path = "../dig2browser-shape", version = "0.5.3" }
dig2browser-trace = { path = "../dig2browser-trace", version = "0.5.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Rpc",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[dev-dependencies]
dig2browser-client = { path = "../dig2browser-client", version = "0.5.3" }
dig2browser-probe = { path = "../dig2browser-probe", version = "0.5.3" }
futures = "0.3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
