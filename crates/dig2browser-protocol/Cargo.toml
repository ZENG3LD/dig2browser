[package]
name = "dig2browser-protocol"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Lightweight versioned IPC contract for dig2browser services"

[lib]
name = "dig2browser_protocol"
path = "src/lib.rs"

[dependencies]
dig2browser-core = { path = "../dig2browser-core" }
tokio = { version = "1", features = ["io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
