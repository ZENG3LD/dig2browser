[package]
name = "dig2browser-trace"
version = "0.5.3"
edition = "2021"
license = "MIT"
description = "Crash-safe trace and artifact ledger for dig2browser collections"
repository = "https://github.com/ZENG3LD/dig2browser"

[lib]
name = "dig2browser_trace"
path = "src/lib.rs"

[dependencies]
dig2browser-protocol = { path = "../dig2browser-protocol", version = "0.5.3" }
sha2 = "0.10"

[dev-dependencies]
dig2browser-core = { path = "../dig2browser-core", version = "0.5.3" }
