[package]
name = "dig2browser"
version = "0.4.16"
edition = "2021"
license = "MIT"
description = "Stealth browser automation with Web Bot Auth — CDP, WebDriver, BiDi backends"
repository = "https://github.com/ZENG3LD/dig2browser"
keywords = ["browser", "automation", "cdp", "web-bot-auth", "stealth"]
categories = ["web-programming", "development-tools::testing"]
readme = "README.md"

[workspace]
members = [
    ".",
    "crates/dig2browser-client",
    "crates/dig2browser-core",
    "crates/dig2browser-crawler",
    "crates/dig2browser-probe",
    "crates/dig2browser-protocol",
    "crates/dig2browser-runtime-lightweight",
    "crates/dig2browser-shape",
    "crates/dig2browser-station",
    "crates/dig2browser-trace",
]
resolver = "2"

[[bin]]
name = "keygen"
path = "src/bin/keygen.rs"

[[bin]]
name = "dev-fetch"
path = "src/bin/dev_fetch.rs"

[[bin]]
name = "dev-attach"
path = "src/bin/dev_attach.rs"

[[bin]]
name = "dev-launch-debug"
path = "src/bin/dev_launch_debug.rs"

[[bin]]
name = "dig2-wasm-test"
path = "src/bin/dig2_wasm_test.rs"

[lib]
name = "dig2browser"
path = "src/lib.rs"

[features]
default = []
containment-test-hooks = []
geckodriver-test-hooks = []
runtime-test-hooks = []

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
web-bot-auth = "0.6.1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
time = "0.3"
indexmap = "2"
url = "2"
aes-gcm = "0.10"
base64 = "0.22"
futures = "0.3"
dashmap = "6"
wasm-bindgen-cli-support = "=0.2.118"
tiny_http = "0.12"
zip = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Security_Cryptography",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
