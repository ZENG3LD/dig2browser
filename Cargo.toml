[package]
name = "dig2browser"
version = "0.5.3"
edition = "2021"
license = "MIT"
description = "Stealth browser automation with Web Bot Auth — CDP, WebDriver, BiDi backends"
repository = "https://github.com/ZENG3LD/dig2browser"
keywords = ["browser", "automation", "cdp", "web-bot-auth", "stealth"]
categories = ["web-programming", "development-tools::testing"]
readme = "README.md"

[workspace]
members = [
    ".",
    "crates/dig2browser-client",
    "crates/dig2browser-core",
    "crates/dig2browser-crawler",
    "crates/dig2browser-probe",
    "crates/dig2browser-protocol",
    "crates/dig2browser-runtime-lightweight",
    "crates/dig2browser-shape",
    "crates/dig2browser-station",
    "crates/dig2browser-trace",
]
resolver = "2"

[[bin]]
name = "keygen"
path = "src/bin/keygen.rs"

[[bin]]
name = "dev-fetch"
path = "src/bin/dev_fetch.rs"

[[bin]]
name = "dev-attach"
path = "src/bin/dev_attach.rs"

[[bin]]
name = "dev-launch-debug"
path = "src/bin/dev_launch_debug.rs"

[[bin]]
name = "dig2-wasm-test"
path = "src/bin/dig2_wasm_test.rs"

[[bin]]
name = "dig2crawl"
path = "src/bin/dig2crawl.rs"
required-features = ["crawler"]

[[bin]]
name = "dig2-stream-node"
path = "src/bin/dig2_stream_node.rs"

[lib]
name = "dig2browser"
path = "src/lib.rs"

[features]
default = []
containment-test-hooks = []
geckodriver-test-hooks = []
runtime-test-hooks = []
# Off by default: browser-driven fetch, Claude-agent CSS-selector discovery,
# and the `dig2crawl` CLI ported from the retired `dig2crawl` crate. Pulls in
# `dig2browser-crawler` (site-profile/record model, parsers, SQLite storage)
# and `gate4agent` (agent CLI transport) — neither is a default dependency.
crawler = [
    "dep:anyhow",
    "dep:chrono",
    "dep:dig2browser-crawler",
    "dep:gate4agent",
    "dep:regex",
    "dep:scraper",
    "dep:toml",
    "dep:tracing-subscriber",
    "reqwest/cookies",
    "reqwest/gzip",
    "reqwest/brotli",
    "reqwest/deflate",
]
# Opt-in embedded Tor client for dev-launch-debug. Off by default so the
# library and a launcher built without this feature stay free of Arti.
# Rebuild that one binary with `--features tor` to accept `--tor`.
tor = ["dep:arti-client", "dep:rustls", "dep:tor-rtcompat", "dep:tracing-subscriber"]

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
# Exact 0.36.0 so this crate and arti-client share one libsqlite3-sys.
# Cargo allows only one package with links = "sqlite3". 0.32 pulls 0.30;
# arti's rusqlite 0.37+ pulls a newer one. 0.36.0 is the overlap.
rusqlite = { version = "=0.36.0", features = ["bundled"] }
web-bot-auth = "0.6.1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
time = "0.3"
indexmap = "2"
url = "2"
aes-gcm = "0.10"
base64 = "0.22"
futures = "0.3"
dashmap = "6"
wasm-bindgen-cli-support = "=0.2.118"
tiny_http = "0.12"
zip = "2"

# crawler feature only (all optional)
anyhow = { version = "1", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
dig2browser-crawler = { path = "crates/dig2browser-crawler", version = "0.5.3", optional = true }
gate4agent = { version = "0.4", optional = true }
regex = { version = "1", optional = true }
scraper = { version = "=0.27.0", default-features = false, features = ["atomic"], optional = true }
toml = { version = "0.8", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# tor feature only. Exact pin. No OpenSSL, no bridges, no onion service, no PoW.
# static-sqlite bundles SQLite the same way this crate already bundles rusqlite,
# so the launcher does not link a system sqlite3. rustls is a direct dependency
# only so this process can install the ring CryptoProvider Arti 0.47 requires
# before it builds a TLS runtime; default features stay off so aws-lc is not pulled.
arti-client = { version = "=0.47.0", optional = true, default-features = false, features = [
    "tokio",
    "rustls",
    "onion-service-client",
    "static-sqlite",
] }
rustls = { version = "=0.23.21", optional = true, default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
# Same release as arti-client. Only so the launcher can name PreferredRuntime;
# arti-client does not re-export it. Features match the client (tokio + rustls).
tor-rtcompat = { version = "=0.47.0", optional = true, default-features = false, features = [
    "tokio",
    "rustls",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Security_Cryptography",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

# saturating-time 0.5.0 livelocks on Windows while computing SystemTime::max_value:
# FILETIME is 100ns, so a 51ns step makes checked_add return Some(self) and the
# search never finishes. Arti calls that during directory bootstrap. This patch
# is the published 0.5.0 crate plus that one loop fix.
[patch.crates-io]
saturating-time = { path = "patches/saturating-time" }
